<!-- Latest compiled and minified Locales -->
<script src=" /static/btst/vendor/jquery/juquery.v431.js"></script>
<link href="/static/btst/css/bootstrap-table.min.css" rel="stylesheet">
<script src="/static/btst/js/bootstrap-table.min.js"></script>
<script src="/static/btst/js/bootstrap-table-zh-CN.min.js"></script>



<header class="page-header {{bgc}}">
    <div class="container-fluid ">
        <h2 class="no-margin-bottom ">查看</h2>
    </div>
</header>

 

<div class="card-body">
    <div class="table-responsive">
        <table id="table"   class="table table-hover table-bordered"> 
            <thead>
                <tr>                  
                  <th>时间</th>
                  <th>入侵IP</th>
                  <th>注入链接</th>
                  <th>代理</th>
                  <th>注入参数</th>
                </tr>
              </thead>
              <tbody>
                {%for d in dat%}
                <tr>                  
                  <td>{{d.time}}</td>
                  <td>{{d.ip}}</td>
                  <td>{{d.url}}</td>
                  <td>{{d.play}}</td>
                  <td>{{d.agant}}</td>
                  
                </tr>
                {%endfor%}
                </tbody>

        </table>
    </div>
</div>
