<script>
    var myChart = echarts.init(document.getElementById('chart'));
    // 确保获取到数组中的第一个对象
    var resp = {{ resp|tojson }};
    var data_SQL = resp[0]['SQL'].map(function (item) {
        return [item[0], item[1]];
    });
    var data_HPT = resp[0]['HPT'].map(function (item) {
        return [item[0], item[1]];
    });

    var option = {
        tooltip: {
            trigger: 'axis'
        },
        legend: {
            data: ['SQL', 'HPT']
        },
        xAxis: {
            type: 'time',
            axisLabel: {
                formatter: function (value) {
                    return echarts.format.formatTime('yyyy-MM-dd HH', value);
                }
            }
        },
        yAxis: {
            type: 'value'
        },
        series: [{
            name: 'SQL',
            type: 'line',
            data: data_SQL
        }, {
            name: 'HPT',
            type: 'line',
            data: data_HPT
        }]
    };
    myChart.setOption(option);
</script>
